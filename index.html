<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SeatFlow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef5;--card:#fff;--ink:#0e1a2b;--mut:#66758b;--line:#e1e7f0;--navy:#0e1a2b;--sel:#ffb020;--selink:#3a2600;--free:#e6f6f1;--freeb:#2fb590;--booked:#e8ebf1;--soon:#fff4dc;--soonb:#e09a14;--ok:#1f9d6e;--bad:#d8434a;--map:#eef2f7;--blk:#e3e9f1;--road:#fff;--water:#cfe3f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b14;--card:#121c2e;--ink:#eef3fa;--mut:#8b9ab0;--line:#22304a;--navy:#0a1424;--free:#12332d;--booked:#1b2638;--soon:#3a2e12;--map:#0f1a2b;--blk:#16233a;--road:#27374f;--water:#13304d}}
:root[data-theme="dark"]{--bg:#060b14;--card:#121c2e;--ink:#eef3fa;--mut:#8b9ab0;--line:#22304a;--navy:#0a1424;--free:#12332d;--booked:#1b2638;--soon:#3a2e12;--map:#0f1a2b;--blk:#16233a;--road:#27374f;--water:#13304d}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center}
button,select{font-family:inherit;color:inherit}
.app{width:100%;max-width:420px;height:100%;max-height:880px;background:var(--card);overflow:hidden;position:relative}
@media(min-width:520px){.app{height:min(880px,96%);border-radius:32px;box-shadow:0 30px 80px rgba(8,20,40,.28)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--card);transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s}
.screen.off{transform:translateX(100%);opacity:0;pointer-events:none}.screen.away{transform:translateX(-28%);opacity:0;pointer-events:none}
.logo{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--sel);display:grid;place-items:center;font-style:normal;font-size:14px}
.role{display:flex;position:relative;background:rgba(14,26,43,.78);border-radius:12px;padding:3px;backdrop-filter:blur(6px)}
.role button{border:0;background:none;color:#cbd6e6;font-weight:600;font-size:12px;padding:7px 12px;z-index:1;cursor:pointer;transition:color .3s}
.role button.on{color:#3a2600}.role .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--sel);border-radius:9px;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.map{position:absolute;left:0;right:0;top:0;height:58%;background:var(--map)}.map svg{width:100%;height:100%;display:block}#home{background:var(--map)}
.mtop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}
.mtop .logo{background:var(--card);padding:6px 12px 6px 7px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);color:var(--ink)}
.mlive{background:var(--card);border-radius:20px;padding:8px 13px;font-size:12px;display:flex;gap:7px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.mlive b{width:8px;height:8px;border-radius:50%;background:#3ddc97;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.7)}100%{box-shadow:0 0 0 9px rgba(61,220,151,0)}}
.bk{fill:var(--blk)}.rd{stroke:var(--road);stroke-width:7;stroke-linecap:round;fill:none}.rv{stroke:var(--water);stroke-width:16;fill:none;stroke-linecap:round}
.sn{font-size:8.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:3px;text-anchor:middle}
.veh{transition:opacity .45s;cursor:pointer}.veh .ring{fill:none;stroke:var(--sel);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.veh.sel .ring{opacity:1;animation:rp 1.4s infinite}@keyframes rp{0%{transform:scale(.9);opacity:.9}100%{transform:scale(2);opacity:0}}
.veh .lbl{font-size:9px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3.5px;text-anchor:middle}
.sheet{position:absolute;left:0;right:0;top:72px;height:calc(100% - 72px);background:var(--card);border-radius:26px 26px 0 0;z-index:2;box-shadow:0 -10px 30px rgba(0,0,0,.14);display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.22,1,.36,1)}.sheet.drag{transition:none}
.dz{padding:12px 0 10px;touch-action:none;cursor:grab}.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}.sbody{flex:1;overflow-y:auto;padding:2px 16px calc(var(--off,0px) + 24px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:none;border-radius:14px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:7px;align-items:center;transition:.3s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;transform:translateY(-1px)}
.pick{display:grid;grid-template-columns:18px 1fr 40px;gap:0 10px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:14px}
.pick .tr{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:3px}.tr i{width:10px;height:10px;border-radius:50%;background:var(--freeb)}.tr u{width:2px;height:20px;background:var(--line)}.tr s{width:10px;height:10px;border-radius:2px;background:var(--navy)}
.pick select{border:0;background:none;font-size:14px;font-weight:600;padding:8px 0;width:100%;outline:none;cursor:pointer}.pick select:first-of-type{border-bottom:1px solid var(--line)}
.swap{grid-row:1/3;grid-column:3;border:1.5px solid var(--line);background:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;transition:transform .4s}
.lh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mut);margin-bottom:10px}.lh b{color:var(--ink);font-size:15px}
.vc{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;cursor:pointer;transition:border-color .3s,background .3s,transform .3s;animation:in .5s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i)*60ms)}
.vc.on{border-color:var(--sel);background:var(--soon);transform:scale(1.015)}
.vc .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.vc b{font-size:14px;display:block}.vc small{color:var(--mut);font-size:12px}.vc .rt{text-align:right;font-weight:700;font-size:14px}.vc .rt small{display:block;font-weight:400}
.go{grid-column:1/4;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:13px;border-radius:12px;cursor:pointer;display:none}.vc.on .go{display:block;animation:in .35s both}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:24px 10px}.empty b{display:block;font-size:30px;margin-bottom:6px}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.fh{background:var(--navy);color:#fff;padding:14px 20px 20px;border-radius:0 0 26px 26px;z-index:3}
.fh .r{display:flex;align-items:center;gap:12px}.back{width:36px;height:36px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
.fh h1{font-size:19px;margin:0;font-weight:700}.sub{font-size:12px;color:#b8c6dc;margin:2px 0 0}
.steps{display:flex;gap:6px;margin-top:14px}.steps span{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.steps span::after{content:"";position:absolute;inset:0;background:var(--sel);transform:scaleX(0);transform-origin:left;transition:transform .5s}.steps span.on::after{transform:scaleX(1)}
.stage{position:relative;flex:1;overflow:hidden}
.panel{position:absolute;inset:0;overflow-y:auto;padding:18px 20px;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s;opacity:0;pointer-events:none;transform:translateX(60px)}
.panel.active{opacity:1;pointer-events:auto;transform:none}.panel.left{transform:translateX(-60px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:12px}.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.deck{background:var(--booked);border-radius:30px 30px 18px 18px;padding:14px 16px 12px}
.drv{display:flex;justify-content:space-between;padding:4px 8px 12px;color:var(--mut);font-size:12px;border-bottom:2px dashed var(--line);margin-bottom:12px}
.row{display:grid;gap:8px;margin:0 auto 8px;align-items:center}.rl{font-size:11px;color:var(--mut);text-align:center}
.seat{aspect-ratio:1;border-radius:11px 11px 7px 7px;border:2px solid var(--freeb);background:var(--free);font-weight:600;font-size:12px;cursor:pointer;position:relative;display:grid;place-items:center;opacity:0;transform:translateY(10px) scale(.85);animation:in2 .45s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i)*22ms);transition:background .25s,border-color .25s,transform .25s}
.na .seat{animation:none;opacity:1;transform:none;cursor:default}
@keyframes in2{to{opacity:1;transform:none}}
.seat:active{transform:scale(.92)}
.seat.booked{background:var(--booked) repeating-linear-gradient(135deg,transparent 0 5px,rgba(120,135,160,.25) 5px 7px);border-color:transparent;color:var(--mut);cursor:not-allowed}
.seat.x{border-color:transparent;background:var(--line);cursor:not-allowed}.seat.soon{background:var(--soon);border:2px dashed var(--soonb)}
.seat.sel{background:var(--sel);border-color:var(--sel);color:var(--selink);transform:translateY(-3px) scale(1.06);box-shadow:0 8px 16px rgba(255,176,32,.45)}
.seat.ld::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:#e8559d;border:2px solid var(--card)}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--mut)}.line b{color:var(--ink);text-align:right}.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-size:16px}
.timer{display:flex;align-items:center;gap:14px;background:var(--soon);border-radius:18px;padding:14px;margin-bottom:14px}.timer small{color:var(--mut);display:block;font-size:12px}
.ring2{width:54px;height:54px;position:relative;flex:none}.ring2 svg{transform:rotate(-90deg)}.ring2 b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}
.pay{display:flex;gap:10px}.pay button{flex:1;border:2px solid var(--line);background:none;border-radius:14px;padding:12px 4px;font-weight:600;font-size:13px;cursor:pointer;transition:.25s}.pay button.on{border-color:var(--freeb);background:var(--free)}
.bar{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;background:var(--card);z-index:2}
.sum{flex:1;min-width:0}.sum b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sum small{color:var(--mut);font-size:12px}
.cta{border:0;background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:15px 24px;border-radius:16px;cursor:pointer;transition:transform .2s,opacity .3s;display:flex;gap:8px;align-items:center;min-width:140px;justify-content:center}.cta:active{transform:scale(.96)}.cta:disabled{opacity:.35;cursor:not-allowed}
.spin{width:16px;height:16px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tick{width:72px;height:72px;margin:0 auto 12px;display:block}.tick circle{stroke:var(--ok);stroke-width:4;fill:none;stroke-dasharray:190;stroke-dashoffset:190}.tick path{stroke:var(--ok);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50}
.panel.active .tick circle{animation:draw .7s .25s ease forwards}.panel.active .tick path{animation:draw .45s .85s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
.center{text-align:center}.center h2{margin:0 0 4px;font-size:20px}.center p{margin:0 0 16px;color:var(--mut);font-size:13px}
.ticket{border:1px solid var(--line);border-radius:22px;overflow:hidden;transform:translateY(30px) rotate(-1deg);opacity:0;transition:.7s 1.1s cubic-bezier(.22,1,.36,1)}.panel.active .ticket{transform:none;opacity:1}
.tk-top{background:var(--navy);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.tk-top small{color:#b8c6dc;font-size:12px;display:block}
.tk-body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.tk-body small{color:var(--mut);font-size:11px;display:block}.tk-body b{font-size:14px}
.tk-cut{border-top:2px dashed var(--line);margin:0 18px}.qr{padding:16px;display:grid;place-items:center}.qr svg{width:150px;height:150px;border-radius:10px;background:#fff;padding:8px}
.dh{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 22px;border-radius:0 0 26px 26px}.dh .t{display:flex;justify-content:space-between;align-items:center}.dh .role{background:rgba(255,255,255,.1)}
.dh h1{font-size:21px;margin:16px 0 2px}
#dbody{flex:1;overflow-y:auto;padding:16px 20px 24px}
.pillst{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;background:var(--booked);color:var(--mut)}.pillst.live{background:var(--free);color:var(--ok)}.pillst b{width:8px;height:8px;border-radius:50%;background:currentColor}.pillst.live b{animation:pulse 1.6s infinite}
.chk{list-style:none;margin:12px 0 0;padding:0}.chk li{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;color:var(--mut);transition:color .3s}.chk li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;color:transparent;transition:.3s}.chk li.ok{color:var(--ink)}.chk li.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stats div{border:1px solid var(--line);border-radius:14px;padding:12px}.stats b{display:block;font-size:20px}.stats small{color:var(--mut);font-size:11px}
.rt2{display:flex;margin:6px 0 16px}.rt2 span{flex:1;text-align:center;font-size:10px;color:var(--mut);position:relative;padding-top:18px}.rt2 span::before{content:"";position:absolute;top:4px;left:0;right:0;height:3px;background:var(--line)}.rt2 span::after{content:"";position:absolute;top:0;left:50%;margin-left:-5px;width:11px;height:11px;border-radius:50%;background:var(--card);border:3px solid var(--line);transition:.4s}
.rt2 span.p::before{background:var(--freeb)}.rt2 span.p::after{border-color:var(--freeb)}.rt2 span.c{color:var(--ink);font-weight:700}.rt2 span.c::after{background:var(--sel);border-color:var(--sel);transform:scale(1.4)}
.btns{display:flex;gap:10px;margin-top:16px}.btns button{flex:1;border:0;border-radius:14px;padding:14px 6px;font-weight:700;font-size:13px;cursor:pointer;background:var(--booked);transition:transform .2s}.btns button:active{transform:scale(.96)}.btns .em{background:var(--bad);color:#fff}.btns .pr{background:var(--navy);color:#fff}
.toast{position:absolute;left:20px;right:20px;top:90px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;z-index:9;transform:translateY(-20px);opacity:0;transition:.4s;pointer-events:none}.toast.show{transform:none;opacity:1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mtop{z-index:3;pointer-events:none}.mtop>*{pointer-events:auto}
.hb{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer;transition:transform .2s}.hb:active{transform:scale(.92)}
.sbtn{width:100%;border:0;background:var(--sel);color:var(--selink);font-weight:700;font-size:15px;padding:15px;border-radius:16px;cursor:pointer;margin-bottom:16px;transition:opacity .3s,transform .2s}.sbtn:disabled{opacity:.4;cursor:not-allowed}.sbtn:active{transform:scale(.98)}
.hint{text-align:center;color:var(--mut);font-size:13px;padding:22px 14px;border:1.5px dashed var(--line);border-radius:16px}.hint b{display:block;font-size:28px;margin-bottom:6px}
.scrim{position:absolute;inset:0;background:rgba(6,11,20,.55);opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:330px;background:var(--card);z-index:21;transform:translateX(-102%);transition:transform .5s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;border-radius:0 26px 26px 0;box-shadow:12px 0 40px rgba(0,0,0,.25)}.drawer.open{transform:none}
.dp{background:var(--navy);color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 22px;border-radius:0 26px 0 0;display:flex;gap:14px;align-items:center}.dp b{display:block;font-size:16px}.dp small{color:#b8c6dc;font-size:12px}
.av{width:56px;height:56px;border-radius:50%;background:var(--sel);color:var(--selink);display:grid;place-items:center;font-weight:700;font-size:22px;overflow:hidden;flex:none;cursor:pointer}.av img{width:100%;height:100%;object-fit:cover}.av.big{width:96px;height:96px;font-size:36px}
.ed{margin-left:auto;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer}
#dnav{padding:10px 0;flex:1;overflow-y:auto}.mi{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;padding:15px 22px;font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:background .2s}.mi:active{background:var(--booked)}
.mi.drvb{margin:14px 16px 0;width:calc(100% - 32px);background:var(--navy);color:#fff;border-radius:16px;padding:15px 16px;justify-content:center}
#subbody{flex:1;overflow-y:auto;padding:18px 20px 28px}
.fl{display:block;font-size:12px;color:var(--mut);margin-bottom:14px}.fl input{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);background:none;border-radius:14px;padding:13px 14px;font:600 15px inherit;font-family:inherit;color:var(--ink);outline:none}.fl input:focus{border-color:var(--freeb)}
.avw{position:relative;width:96px;margin:6px auto 22px}.cam{position:absolute;right:-6px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;border:3px solid var(--card)}
.cta.full{width:100%}
.hi{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;animation:in .45s both}.hi div{display:flex;justify-content:space-between;align-items:center;gap:8px}.hi div+div{margin-top:6px}.hi small{color:var(--mut);font-size:12px}.hi b{font-size:14px}.tg{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--booked);color:var(--mut)}.tg.up{background:var(--soon);color:var(--soonb)}.tg.ok{background:var(--free);color:var(--ok)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}.sw small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tgl{width:46px;height:28px;border-radius:16px;background:var(--line);border:0;position:relative;cursor:pointer;transition:background .3s;flex:none}.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s;box-shadow:0 1px 4px rgba(0,0,0,.3)}.tgl.on{background:var(--freeb)}.tgl.on::after{transform:translateX(18px)}
.sg{margin:6px 0 22px}.sg h4{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:600}.seg2{display:flex;background:var(--booked);border-radius:14px;padding:4px;gap:4px}.seg2 button{flex:1;border:0;background:none;padding:11px 6px;border-radius:11px;font-weight:600;font-size:13px;cursor:pointer;transition:.3s}.seg2 button.on{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12)}

function cases(){const o=[];HIST.filter(x=>x.issues&&x.issues.length).forEach(x=>o.push({id:'R'+x.id,k:'Trip issue',t:x.issues.join(', '),sub:`${x.v} · ${x.r} · ${x.d}`,tk:x}));P.lost.forEach(l=>o.push({id:l.id,k:'Lost item',t:l.item,sub:l.trip,lost:1}));D.alerts.forEach(a=>o.push({id:a.id||'S'+a.t,k:'SOS',t:`${a.src} SOS near ${a.loc}`,sub:`${a.bus} · ${a.t}`,sos:a}));return o}
function aCs(){const c=cases();return c.length?c.map(x=>{const st2=OWN.cmp[x.id]||(x.sos&&x.sos.ack?'Acknowledged':'Open');return`<div class="cc"><div class="crow" style="border:0;padding-top:0"><span><b>${x.k}: ${esc(x.t)}</b><br><small>${esc(x.sub)}</small></span>${chp(st2==='Open'?'up':'ok',st2)}</div>${st2==='Open'?`<div class="cbtn">${x.tk?`<button class="ok" data-c="cref" data-v="${x.id}">Refund ${rs(x.tk.f)}</button>`:''}${x.lost?`<button class="ok" data-c="cfound" data-v="${x.id}">Mark found</button>`:''}<button class="g" data-c="cres" data-v="${x.id}">Resolve</button></div>`:''}</div>`}).join(''):'<div class="hint"><b>📋</b>No complaints, lost-item reports or emergencies right now. Ratings with issues, lost reports and SOS alerts appear here.</div>'}
function aSx(){const a=agg(),all=HIST.filter(x=>x.vid!==undefined),rt=all.filter(x=>x.rate),avg=rt.length?(rt.reduce((s2,x)=>s2+x.rate,0)/rt.length).toFixed(1):'–';
  return`<div class="stats"><div><b>${a.b}</b><small>Bookings today</small></div><div><b style="font-size:16px">${rs(a.r)}</b><small>Revenue</small></div><div><b>${avg}</b><small>Avg rating</small></div></div>
  <div class="cc"><h4>Commission</h4><div class="crow"><span>Platform commission</span><span class="stp"><button data-c="comm" data-v="-1" aria-label="Decrease">−</button><b>${OWN.comm}%</b><button data-c="comm" data-v="1" aria-label="Increase">+</button></span></div><div class="crow"><span>Earned on today's revenue</span><b>${rs(Math.round(a.r*OWN.comm/100))}</b></div></div>
  <div class="cc"><h4>Passenger account</h4><div class="crow"><span>${OWN.dis?'Disabled':'Active'}<br><small>Disabling blocks new bookings</small></span><button class="tgl ${OWN.dis?'':'on'}" data-c="acct" aria-label="Account active"></button></div></div>
  <div class="cc"><h4>Audit log</h4>${OWN.audit.length?OWN.audit.slice(0,12).map(x=>`<div class="crow"><span>${esc(x.m)}<br><small>${x.r}</small></span><small>${ago(x.t)}</small></div>`).join(''):'<small>No actions recorded yet.</small>'}</div>`}
function crender(force){const r=CS.role;$('ctitle').textContent=r==='o'?'Owner dashboard':'Admin panel';$('csub').textContent=r==='o'?'Sajha Transport · demo operator':'Control centre · demo access';
  $('ctabs').innerHTML=CT[r].map(x=>`<button data-t="${x[0]}" class="${CS.tab===x[0]?'on':''}">${x[1]}</button>`).join('');if(r==='o'&&CS.tab==='ov')docAlerts();
  const f={ov:oOv,fl:oFl,st:oSt,fr:oFr,vf:aVf,lv:aLv,cs:aCs,sx:aSx}[CS.tab],h=f(),b=$('cbody');if(force||b._h!==h){b.innerHTML=h;b._h=h}nBadge()}
function goCon(g){const r=g==='verify'||g==='cases'?'a':'o';gate(r,()=>{setRole(r);CS.tab={verify:'vf',cases:'cs',fleet:'fl',staff:'st'}[g];crender(true)})}
function gate(r,cb){if(SESS[r])return cb();const md=$('md'),code=r==='o'?'1234':'4321';$('mc2').innerHTML=`<h3>Staff sign-in</h3><p>${r==='o'?'Owner dashboard':'Admin panel'} is for authorised staff. Enter your passcode. (Demo passcode: ${code})</p><label class="fl"><input id="gpin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" style="text-align:center;font-size:22px;letter-spacing:8px"></label><div class="mb"><button data-m="no">Cancel</button><button class="pri" data-m="go">Sign in</button></div>`;md.hidden=false;setTimeout(()=>$('gpin')&&$('gpin').focus(),50);
  const go=()=>{if($('gpin').value===code){SESS[r]=true;md.hidden=true;audit('Signed in',r==='o'?'Owner':'Admin');cb()}else{$('gpin').value='';toast('Wrong passcode.')}};md.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;b.dataset.m==='no'?md.hidden=true:go()};$('gpin').onkeydown=e=>{if(e.key==='Enter')go()}}
function admUpd(){if(role==='a'&&CS.tab==='lv')V.forEach(v=>{const g=$('a'+v.id);if(g){const q=ptAt(v,v.p*v.L);g.setAttribute('transform',`translate(${q[0]} ${q[1]})`)}})}
$('cback').onclick=()=>setRole('p');$('cbell').onclick=()=>{INR=role;openSub('inbox')};$('ctabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){CS.tab=b.dataset.t;crender(true)}};
$('cbody').onchange=e=>{const sel=e.target.closest('[data-rt]');if(!sel)return;const v=V[+sel.dataset.rt],i=+sel.value;if(v.live)return;setRoute2(v,RT[i][1].slice());v.p=0;v.stopIdx=0;genBk(v);OWN.routeAs[v.id]=i;osave();audit(`Route of ${v.name} set to ${RT[i][0]}`);if(TRK&&TRK.vid===v.id)cancelBooking();drawList();crender(true)};
$('cbody').onclick=e=>{const b=e.target.closest('[data-c]');if(!b||b.disabled)return;const a=b.dataset.c,v=b.dataset.v,rid=()=>Math.random().toString(36).slice(2,7).toUpperCase();
  if(a==='susp'){const x=V[+v];x.susp=!x.susp;if(x.susp&&x.live)endDrv(x);if(x.susp&&TRK&&TRK.vid===x.id&&TRK.stage==='pickup')cancelBooking();OWN.sus=V.filter(y=>y.susp).map(y=>y.id);osave();audit(`${x.susp?'Suspended':'Reactivated'} ${x.name}`);notify('ops',x.susp?'Bus suspended':'Bus reactivated',x.name,{role:CS.role==='a'?'o':'a',go:CS.role==='a'?'fleet':'verify',key:'su'+x.id+Date.now()});drawList();mapState()}
  if(a==='addbus'){const n=$('nbn').value.trim(),no=$('nbno').value.trim();if(!n||!no)return toast('Enter the bus name and number plate.');OWN.pend.push({id:'PB'+rid(),name:n,no,t:$('nbt').value,ri:+$('nbr').value});osave();audit(`Submitted bus ${n} (${no})`);notify('admin','Bus awaiting verification',`${n} (${no})`,{role:'a',go:'verify',key:'pb'+no});toast('Bus submitted for verification.')}
  if(a==='appbus'||a==='rejbus'){const p=OWN.pend.find(x=>x.id===v);if(!p)return;OWN.pend=OWN.pend.filter(x=>x.id!==v);if(a==='appbus'){OWN.added.push({name:p.name,no:p.no,t:p.t,ri:p.ri});addVehicle(OWN.added[OWN.added.length-1]);notify('ops','Bus approved',`${p.name} is now live for passengers.`,{role:'o',go:'fleet',key:'ap'+p.id});audit(`Approved ${p.name}`)}else{notify('ops','Bus rejected',`${p.name}: documents could not be verified.`,{role:'o',go:'fleet',key:'rj'+p.id});audit(`Rejected ${p.name}`)}osave();drawList()}
  if(a==='addstaff'){const n=$('sn').value.trim(),ph=$('sp').value.trim();if(!n||!/^\d{7,15}$/.test(ph.replace(/\D/g,'')))return toast('Enter a name and a valid phone number.');OWN.staff.push({id:'ST'+rid(),name:n,phone:ph,role:$('sr').value,bus:+$('sb').value,status:'Pending',perm:{start:true,scan:true,notify:true,revenue:false}});osave();audit(`Added ${$('sr').value.toLowerCase()} ${n}`);notify('admin','Staff awaiting verification',`${n} (${$('sr').value})`,{role:'a',go:'verify',key:'st'+n+Date.now()});toast('Added. An admin must verify before they can work.')}
  if(a==='perm'){const q=v.split('|'),x=OWN.staff.find(y=>y.id===q[0]);if(x){x.perm[q[1]]=!x.perm[q[1]];osave();audit(`${x.name}: ${q[1]} ${x.perm[q[1]]?'allowed':'removed'}`)}}
  if(a==='rmstaff'){OWN.staff=OWN.staff.filter(x=>x.id!==v);osave();audit('Removed staff member')}
  if(a==='verstaff'||a==='rejstaff'){const x=OWN.staff.find(y=>y.id===v);if(x){x.status=a==='verstaff'?'Verified':'Rejected';osave();audit(`${a==='verstaff'?'Verified':'Rejected'} ${x.name}`);notify('ops',`Staff ${x.status.toLowerCase()}`,x.name,{role:'o',go:'staff',key:'vs'+x.id+x.status})}}
  if(a==='renew'){const q=v.split('|');notify('ops','Please renew a document',`${V[+q[0]].name}: ${q[1]}`,{role:'o',go:'fleet',key:'rn'+v+Date.now()});audit(`Asked owner to renew ${q[1]} for ${V[+q[0]].name}`);toast('Reminder sent to the owner.')}
  if(a==='fr'){const q=v.split('|');FR[q[0]]=Math.max(q[0]==='fee'?0:5,FR[q[0]]+ +q[1])}
  if(a==='frsave'){Object.keys(T).forEach(k=>{T[k].f=FR[k];OWN.fares[k]=FR[k]});FEE=FR.fee;OWN.fee=FEE;osave();audit('Updated fares');notify('ops','Fares updated','New fares apply to the next booking.',{role:'o',key:'fr'+Date.now()});drawList();toast('Fares saved.')}
  if(a==='frreset'){FR=null}
  if(a==='ack'){const x=D.alerts.find(y=>y.id===v);if(x){x.ack=true;dsave();audit(`Acknowledged SOS near ${x.loc}`)}}
  if(a==='cres'){OWN.cmp[v]='Resolved';osave();audit('Resolved a case')}
  if(a==='cref'){const x=HIST.find(y=>'R'+y.id===v);if(x){W.bal+=x.f;W.tx.unshift({k:'Refund '+x.id+' (complaint)',a:x.f,d:today()});savW();OWN.cmp[v]='Refunded';osave();audit(`Refunded ${rs(x.f)} for ${x.id}`);notify('wallet','Complaint resolved',`${rs(x.f)} was refunded to your wallet.`,{go:'wallet',key:'cr'+x.id})}}
  if(a==='cfound'){OWN.cmp[v]='Found';osave();audit('Marked a lost item as found');notify('book','Lost item update','Your lost item was found. Contact the operator to collect it.',{go:'history',key:'lf'+v})}
  if(a==='comm'){OWN.comm=Math.max(1,Math.min(30,OWN.comm+ +v));osave();audit(`Commission set to ${OWN.comm}%`)}
  if(a==='acct'){OWN.dis=!OWN.dis;osave();audit(OWN.dis?'Disabled passenger account':'Enabled passenger account');notify('book',OWN.dis?'Account disabled':'Account enabled',OWN.dis?'New bookings are blocked. Contact support.':'You can book again.',{key:'ac'+Date.now()})}
  crender(true)};
setInterval(()=>{if((role==='o'&&CS.tab==='ov')||(role==='a'&&CS.tab==='lv'))crender()},1500);
/* apply saved owner settings */
Object.keys(OWN.fares).forEach(k=>{if(T[k])T[k].f=OWN.fares[k]});FEE=OWN.fee||10;OWN.added.forEach(addVehicle);OWN.sus.forEach(i=>{if(V[i])V[i].susp=true});Object.keys(OWN.routeAs).forEach(i=>{const v=V[+i];if(v&&!v.drv){setRoute2(v,RT[OWN.routeAs[i]][1].slice());genBk(v)}});
drawList();requestAnimationFrame(frame);
</script>
